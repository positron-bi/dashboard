<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>گزارش‌های موردی | Positron BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --accent:#b91c1c; --text:#172033; --muted:#657086; --border:#d9e0ea; } * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:24px; color:var(--text); font-family:"Vazirmatn",Tahoma,Arial,sans-serif; background:#f6f8fb; }
    main { width:min(1120px,100%); margin:0 auto; } #login-panel { width:min(560px,100%); margin:10vh auto; padding:36px; text-align:center; background:#fff; border:1px solid var(--border); border-radius:12px; box-shadow:0 18px 45px rgba(20,34,59,.12); }
    .icon { display:grid; place-items:center; width:62px; height:62px; margin:0 auto 20px; color:#fff; background:var(--accent); border-radius:8px; }.icon svg,.report-icon svg { width:32px; height:32px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    h1 { margin:0; font-size:clamp(26px,4vw,36px); } p { color:var(--muted); line-height:1.9; } form { display:grid; gap:12px; margin-top:24px; text-align:right; } label { color:var(--muted); font-size:14px; } input { width:100%; margin-top:6px; padding:11px 12px; border:1px solid var(--border); border-radius:7px; font:inherit; } button { padding:11px 14px; border:0; border-radius:7px; color:#fff; background:var(--accent); font:inherit; font-weight:700; cursor:pointer; } .error { margin:0; color:#b91c1c; font-size:13px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:8px 0 20px; border-bottom:1px solid var(--border); } header p { margin:6px 0 0; } .back { color:var(--accent); font-weight:700; text-decoration:none; white-space:nowrap; }
    .reports-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:18px; padding:28px 0; }.report-card { display:flex; flex-direction:column; min-height:230px; padding:22px; background:#fff; border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 26px rgba(20,34,59,.08); transition:transform 160ms ease,box-shadow 160ms ease,border-color 160ms ease; }.report-card:hover { transform:translateY(-4px); border-color:var(--accent); box-shadow:0 18px 45px rgba(20,34,59,.12); }.report-icon { display:grid; place-items:center; width:54px; height:54px; margin-bottom:18px; color:#fff; background:var(--accent); border-radius:8px; }.report-card h2 { margin:0; font-size:19px; line-height:1.7; overflow-wrap:anywhere; }.report-card p { margin:9px 0 16px; font-size:13px; }.open { margin-top:auto; color:var(--accent); font-size:14px; font-weight:700; text-decoration:none; }.delete { margin-top:12px; padding:7px 0; color:#b91c1c; background:transparent; border:1px solid #fecaca; border-radius:6px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }.delete:hover { background:#fef2f2; }.reports-status { margin:0; color:var(--muted); font-size:13px; }.reports-status.error { color:#b91c1c; }.empty,.loading { grid-column:1 / -1; padding:38px; text-align:center; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:8px; }
    @media(max-width:1040px){.reports-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:640px){body{padding:16px}header{align-items:flex-start;flex-direction:column}.reports-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="login-panel">
    <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span>
    <h1>ورود به گزارش‌های موردی</h1><p>برای مشاهدهٔ گزارش‌های منتشرشده، اطلاعات ورود را وارد کنید.</p>
    <form id="login-form"><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="error-message" hidden>اطلاعات ورود درست نیست.</p><button type="submit">ورود</button></form>
  </main>
  <main id="folder-content" hidden>
    <header><div><h1>گزارش‌های موردی</h1><p>گزارش‌های منتشرشده را انتخاب کنید.</p><p class="reports-status" id="reports-status" aria-live="polite"></p></div><a class="back" href="../">بازگشت به صفحهٔ اصلی</a></header>
    <section class="reports-grid" id="reports-list" aria-live="polite"><div class="loading">در حال دریافت گزارش‌ها…</div></section>
  </main>
  <script>
    const accessKey="positron-folder-access",validUsername=atob("YWRtaW4="),validPassword=atob("Nzc3Nw=="),repository="positron-bi/dashboard",uploadsPath="ad-hoc-reports/uploads";
    const loginPanel=document.getElementById("login-panel"),folderContent=document.getElementById("folder-content"),reportsList=document.getElementById("reports-list"),reportsStatus=document.getElementById("reports-status");
    const githubUrl=(path)=>`https://api.github.com/repos/${repository}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
    const formatFileSize=(size)=>size<1024*1024?`${Math.ceil(size/1024)} کیلوبایت`:`${new Intl.NumberFormat("fa-IR",{maximumFractionDigits:1}).format(size/(1024*1024))} مگابایت`;
    const reportTitle=(name)=>name.replace(/^\d+-/,"").replace(/\.html?$/i,"").replace(/[-_]/g," ");
    function createReportCard(report){const card=document.createElement("article"),isHtml=/\.html?$/i.test(report.name),path=report.path.split("/").map(encodeURIComponent).join("/");card.className="report-card";card.innerHTML='<span class="report-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"></path><path d="M16 3v4h4"></path><path d="M8 11h8"></path><path d="M8 15h8"></path><path d="M8 19h5"></path></svg></span>';const title=document.createElement("h2"),detail=document.createElement("p"),open=document.createElement("a"),remove=document.createElement("button");title.textContent=reportTitle(report.name);detail.textContent=formatFileSize(report.size);open.className="open";open.href=isHtml?`https://positron-bi.github.io/dashboard/${path}`:report.download_url;open.target="_blank";open.rel="noopener";open.textContent="مشاهده گزارش";remove.className="delete";remove.type="button";remove.textContent="حذف گزارش";remove.addEventListener("click",()=>deleteReport(report));card.append(title,detail,open,remove);return card;}
    async function deleteReport(report){if(!confirm(`گزارش «${reportTitle(report.name)}» حذف شود؟`))return;const token=prompt("برای حذف، توکن GitHub را وارد کنید. این مقدار ذخیره نمی‌شود:");if(!token)return;reportsStatus.classList.remove("error");reportsStatus.textContent="در حال حذف گزارش…";try{const response=await fetch(githubUrl(report.path),{method:"DELETE",headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,"Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({message:`Delete ad hoc report: ${report.name}`,sha:report.sha})});if(!response.ok){const error=await response.json().catch(()=>({}));throw new Error(error.message||`HTTP ${response.status}`)}reportsStatus.textContent="گزارش حذف شد.";await loadReports()}catch(error){console.error("Unable to delete report",error);reportsStatus.textContent=`حذف ناموفق بود: ${error.message}`;reportsStatus.classList.add("error")}}
    async function loadReports(){try{const response=await fetch(githubUrl(uploadsPath),{headers:{Accept:"application/vnd.github+json"}});if(response.status===404){reportsList.innerHTML='<div class="empty">هنوز گزارشی منتشر نشده است.</div>';return}if(!response.ok)throw new Error(`HTTP ${response.status}`);const reports=await response.json(),files=Array.isArray(reports)?reports.filter((item)=>item.type==="file"&&item.name!==".gitkeep"):[];if(!files.length){reportsList.innerHTML='<div class="empty">هنوز گزارشی منتشر نشده است.</div>';return}reportsList.replaceChildren(...files.sort((a,b)=>b.name.localeCompare(a.name)).map(createReportCard))}catch(error){console.error("Unable to load reports",error);reportsList.innerHTML='<div class="empty">دریافت فهرست گزارش‌ها ناموفق بود. صفحه را دوباره بارگذاری کنید.</div>'}}
    function grantAccess(){sessionStorage.setItem(accessKey,"granted");loginPanel.hidden=true;folderContent.hidden=false;loadReports()}if(sessionStorage.getItem(accessKey)==="granted")grantAccess();document.getElementById("login-form").addEventListener("submit",(event)=>{event.preventDefault();if(document.getElementById("username").value===validUsername&&document.getElementById("password").value===validPassword)grantAccess();else document.getElementById("error-message").hidden=false});
  </script>
</body>
</html>
