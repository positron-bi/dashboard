<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>افزودن گزارش | Positron BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--accent:#7c2d12;--text:#172033;--muted:#657086;--border:#d9e0ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;color:var(--text);font-family:"Vazirmatn",Tahoma,Arial,sans-serif;background:#f6f8fb}main{width:min(620px,100%);padding:36px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 45px rgba(20,34,59,.12);text-align:center}.icon{display:grid;place-items:center;width:62px;height:62px;margin:0 auto 20px;color:#fff;background:var(--accent);border-radius:8px}.icon svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}h1{margin:0;font-size:28px}p{color:var(--muted);line-height:1.9}form{display:grid;gap:12px;text-align:right;margin-top:24px}label{color:var(--muted);font-size:14px}input{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--border);border-radius:7px;font:inherit}button{padding:11px 14px;border:0;border-radius:7px;color:#fff;background:var(--accent);font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.7;cursor:wait}.error{margin:0;color:#b91c1c;font-size:13px}.status{margin:0;font-size:13px;color:var(--muted)}.status.error{color:#b91c1c}a{display:inline-block;margin-top:22px;color:var(--accent);font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main id="login-panel"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></span><h1>افزودن گزارش</h1><p>برای بارگذاری گزارش جدید، اطلاعات ورود را وارد کنید.</p><form id="login-form"><label>نام کاربری<input id="username" autocomplete="username" required></label><label>رمز عبور<input id="password" type="password" autocomplete="current-password" required></label><p class="error" id="login-error" hidden>اطلاعات ورود درست نیست.</p><button type="submit">ورود</button></form><a href="../">بازگشت به صفحهٔ اصلی</a></main>
  <main id="upload-panel" hidden><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 16V3"></path><path d="m7 8 5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg></span><h1>بارگذاری گزارش جدید</h1><p>فایل تا حجم ۲۵ مگابایت منتشر می‌شود. توکن فقط برای همین ارسال استفاده می‌شود و ذخیره نمی‌شود.</p><form id="upload-form"><label>GitHub Token<input id="github-token" type="password" autocomplete="off" spellcheck="false" required></label><label>فایل گزارش<input id="report-file" type="file" required></label><p class="status" id="upload-status" aria-live="polite"></p><button id="upload-button" type="submit">آپلود و انتشار</button></form><a href="index.html">مشاهده گزارش‌های منتشرشده</a></main>
  <script>
    const validUsername=atob("YWRtaW4="),validPassword=atob("Nzc3Nw=="),repository="positron-bi/dashboard",uploadsPath="ad-hoc-reports/uploads",maxFileSize=25*1024*1024;
    const loginPanel=document.getElementById("login-panel"),uploadPanel=document.getElementById("upload-panel"),status=document.getElementById("upload-status"),button=document.getElementById("upload-button");
    const githubUrl=(path)=>`https://api.github.com/repos/${repository}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
    const setStatus=(message,error=false)=>{status.textContent=message;status.classList.toggle("error",error)};
    document.getElementById("login-form").addEventListener("submit",(event)=>{event.preventDefault();if(document.getElementById("username").value===validUsername&&document.getElementById("password").value===validPassword){loginPanel.hidden=true;uploadPanel.hidden=false}else document.getElementById("login-error").hidden=false});
    const asBase64=(file)=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result.split(",",2)[1]);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(file)});
    document.getElementById("upload-form").addEventListener("submit",async(event)=>{event.preventDefault();const token=document.getElementById("github-token").value.trim(),file=document.getElementById("report-file").files[0];if(!token||!file)return;if(file.size>maxFileSize){setStatus("حجم فایل باید حداکثر ۲۵ مگابایت باشد.",true);return}const name=file.name.replace(/[\\/:*?\"<>|]/g,"-")||"report";button.disabled=true;setStatus("در حال آپلود و انتشار گزارش…");try{const response=await fetch(githubUrl(`${uploadsPath}/${Date.now()}-${name}`),{method:"PUT",headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${token}`,"Content-Type":"application/json","X-GitHub-Api-Version":"2022-11-28"},body:JSON.stringify({message:`Add ad hoc report: ${name}`,content:await asBase64(file)})});if(!response.ok){const error=await response.json().catch(()=>({}));throw new Error(error.message||`HTTP ${response.status}`)}document.getElementById("report-file").value="";document.getElementById("github-token").value="";setStatus("گزارش با موفقیت منتشر شد.")}catch(error){console.error("Unable to upload report",error);setStatus(error instanceof TypeError&&error.message==="Failed to fetch"?"ارتباط مرورگر با GitHub برقرار نشد.":`آپلود ناموفق بود: ${error.message}`,true)}finally{button.disabled=false}});
  </script>
</body>
</html>
